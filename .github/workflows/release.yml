name: Release

# Publishing runs only when a maintainer dispatches this workflow, and the publish job waits for
# approval on the `npm-publish` environment. Pull requests and pushes never publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must match packages/cli/package.json)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gates:
    name: release gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release readiness
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/check-release.mjs "$VERSION"
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Verify package
        run: node scripts/verify-package.mjs --out artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish to npm
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance; no long-lived token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: artifacts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Publishes the exact tarball that passed the gates.
      - run: npm publish artifacts/*.tgz --access public --provenance

  smoke:
    name: smoke test published package
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Run the published CLI in a clean project
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/smoke-published.mjs "$VERSION"
