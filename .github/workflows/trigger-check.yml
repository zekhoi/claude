name: Trigger check

# Reruns the cases in evals/triggers.json with Claude Code and fails when a negative case picks its
# skill or fewer cases than the recorded minimum pick theirs. Costs a few dollars per run.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      claude-code-version:
        description: Claude Code version to install from npm
        default: latest
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  triggers:
    name: triggers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version || 'latest' }}
    steps:
      - name: Skip without an API key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::Set the ANTHROPIC_API_KEY repository secret to run the trigger check."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.ANTHROPIC_API_KEY != ''
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.ANTHROPIC_API_KEY != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version: 24
          cache: pnpm
      - if: env.ANTHROPIC_API_KEY != ''
        run: pnpm install --frozen-lockfile
      - if: env.ANTHROPIC_API_KEY != ''
        run: pnpm build
      - name: Install Claude Code
        if: env.ANTHROPIC_API_KEY != ''
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Check triggers
        if: env.ANTHROPIC_API_KEY != ''
        run: node evals/check-triggers.mjs --out "$RUNNER_TEMP/triggers"
